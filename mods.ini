; Settings of the game client mods in version.dll (64-bit clients only, except for the logging option).
; All mods are off until turned on here. Delete a line to use its default.

[Logging]
; Write debug info to version.log next to version.dll, including details about client crashes when they occur
Enabled=0

[ChatTime]
; Show message times in the chat window for pre-5.x clients that don't support this feature natively: 0 = off, 1 = HH:MM, 2 = HH:MM:SS
Format=0

[AntiAfk]
; Stay connected after 60 minutes without input
Enabled=0
; No disconnect 26 hours after logging in
NoSessionTimeout=0

[Ping]
; Show an overlay with the round trip time to the game server in the style of the DXVK HUD; drag it with the left mouse button to move it
; 0 = off, 1 = toggled via /ping, 2 = always visible
OverlayMode=0
; Milliseconds between measurements (500..60000)
Interval=3000
; Where the base line of the text starts, in screen pixels like the DXVK HUD; saved when the text is dragged; the default is the line below the DXVK frame rate
X=8
Y=48
; Text size relative to the DXVK HUD (0.25..4), like its scale option
Scale=1

[Macros]
; How many macros the client allows, up to 127; 0 keeps the client's own limit (12 in 4.x, 24 in 5.x); the game server has to accept them too
Limit=0

[Buffs]
; If set, a window shows up to 64 buffs and 64 debuffs; 0 keeps the client's window, which shows 24 buffs and 24 debuffs in 4.x, 40 buffs and 24 debuffs in 5.x.
; The game server decides how many effects a character has (retail servers: 16 buffs, 20 debuffs).
; Icons per row in the buff window of the target, 1..64 (the client's: 10), with as many rows as the effects take
TargetColumns=0
; Icons per row in the own buff and debuff windows, 1..64 (the client's: 8), the windows sized for all 64
OwnColumns=0

[Stats]
; Show attack, casting and movement speed in the character window with as many decimals as they have (up to 3) instead of 1
Enabled=0

[QuestTargets]
; Show quest icons in front of the names of monsters a quest step needs, as 4.9+ clients already do by themselves
; as well as the green glow over gatherable quest objects that 4.7+ clients show
; Note: Verified to work in 4.6.2 and 4.8, but not in 3.9, as its data has no quest target effect and the quest icons are not found there
Enabled=0

[MoveReports]
; Your own character. The game server checks skill range, area hits and line of sight along the path your client reports to it,
; but the client reports only once you stray 1 m from where its last report carries you or turn by more than 30 degrees, and then
; holds the report back 150 ms; around corners, pillars and sharp turns the server's path therefore cuts the corner by up to a
; meter or two: "target is too far" while you stand next to it, area skills missing you or others, other players seeing you run
; through edges. The mod makes the client report sooner there (held back 50 ms, after 0.5 m or 15 degrees, a report per 0.06 s
; instead of 0.23 s); running in a straight line sends no more packets.
; 0 = off, the client reports as it does by itself
Enabled=1

[OthersPosition]
; Other characters. The client moves them on along
; their last reported direction and puts them back where the game server says they are only once they are off by half a second
; of their speed (3-4 m running in 4.x; 5.x waits a whole second), and never while they are in the air. With this mod you see them
; closer to where the server has them (put back once they lag a quarter of a second of their speed, and in the air too, so one
; the client let fall off a ledge comes back up), so you aim and judge range against the same place the server checks. It
; changes only what you see.
; 0 = off, the client puts them back as it does by itself
Enabled=1

[UiScale]
; Scale the UI as 4.x does, so that 100 % fits the screen at any resolution (2.25 times on 3840x2160) and the slider goes from 70 to 100 % (5.x)
Fit=0
; Fonts from this pixel height get the larger glyph cells, so letters like g and y keep their tails at high UI scales (5.x); 33 keeps the client's own, 24 suits a 3840x2160 screen
LargeGlyphFrom=33

[MultiClient]
; Start more than two clients at once; without it a third client closes the other two
Enabled=0

[Login]
; Go from the login straight to the server list, without the user agreement in between
SkipAgreement=0

[Destroy]
; Items of the Black Cloud Merchants and the ones the client marks as rare ask to type a word to be destroyed; with this they get
; the usual yes-or-no question instead, and the item is still destroyed only after it
SkipTypedConfirm=0

[SystemCfg]
; Read and save system.cfg in plain text, so it can be edited; a client without this mod ignores the settings of such a file
PlainText=0

[Graphics]
; 1 = use the DXVK d3d9.dll next to the client when there is one; 0 = use the Direct3D 9 of Windows even then, without removing
; the file (under wine the d3d9.dll of the wine prefix is used, which may be DXVK as well)
DXVK=1

[Performance]
; Accelerate loading of the game data for a faster start and exit: faster unpacking of the .pak files and string handling, and in 4.x
; clients the item, skill, NPC and other large tables kept as dumps in Data/Dump (about 200 MB) and loaded from there from the second
; start on, as 5.x clients do by themselves: the login screen comes 3 (4.8) to 4 (4.6) seconds sooner. The dumps are written anew when
; a .pak file of the game data changes or the client did not quit normally.
; 0 = off, 1 = on, 2 = on, plus it skips the logo before the login screen and the picture after quitting
LoadingMode=0
; Use mimalloc in place of the game's memory allocators; it accelerates loading times and can improve overall performance, but uses an
; additional 600 MB to 1 GB of memory
Mimalloc=0
; Animate characters farther than this many meters from the camera every second frame, farther than twice as far every fourth, and the
; ones off the screen or beyond about 35 m every eighth, as the engine itself can do (ca_SkipBoneAnim) but has off; their skinning
; follows, so a crowd costs less: with 300 monsters around the character 13.5 ms a frame became 10.5 ms at 10 and 9.6 ms at 6. The
; animation keeps its speed, only far characters move in fewer steps. 0 = off, every character every frame
AnimationLod=0
