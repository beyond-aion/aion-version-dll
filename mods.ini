; Settings of the game client mods in version.dll (64-bit clients only).
; All mods are off until turned on here. Delete a line to use its default. Problems in this file are written to mods.log.

[General]
; write mods.log next to version.dll (1) or not (0)
Log=0

[ChatTime]
; shows the time in front of chat messages for pre-5.x clients that don't support this feature natively: 0=off, 1=HH:MM, 2=HH:MM:SS
Format=0

[AntiAfk]
; stay connected after 60 minutes without input
Enabled=0
; no disconnect 26 hours after logging in
NoSessionTimeout=0

[Ping]
; round trip time to the game server, shown like the DXVK HUD; drag it with the left mouse button to move it
Enabled=0
; milliseconds between measurements (1000..60000)
Interval=3000
; where the base line of the text starts, in screen pixels like the DXVK HUD; saved when the text is dragged; the default is the line below the DXVK frame rate
X=8
Y=48
; text size relative to the DXVK HUD (0.25..4), like its scale option
Scale=1

[Macros]
; how many macros the client allows, up to 127; 0 keeps the client's own limit (12 in 4.x, 24 in 5.x); the game server has to accept them too
Limit=0

[Stats]
; attack, casting and movement speed in the character window with as many decimals as they have (up to 3) instead of 1
Enabled=0

[QuestTargets]
; 4.6/4.8: the icon of the quest kind (as in the quest window) in front of the names of monsters a quest in progress needs,
; and on 4.6 the green glow over gatherable objects it needs, as later clients show; 5.x shows both by itself
Enabled=0

[UiScale]
; 5.x: highest UI scale in percent, 130 keeps the client's own limit; the result is still capped at the screen size relative to 1280x960, 225 on 3840x2160
Max=130
; 5.x: fonts from this pixel height get the larger glyph cells, so letters like g and y keep their tails at high UI scales; 33 keeps the client's own, 24 suits a UI scale of 225
LargeGlyphFrom=33
