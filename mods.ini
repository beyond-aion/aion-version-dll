; Settings of the game client mods in version.dll (64-bit clients only).
; All mods are off until turned on here. Delete a line to use its default. Problems in this file are written to mods.log.

[General]
; Write mods.log next to version.dll (1) or not (0), also in 32-bit clients
Log=0

[ChatTime]
; Show message times in the chat window for pre-5.x clients that don't support this feature natively: 0 = off, 1 = HH:MM, 2 = HH:MM:SS
Format=0

[AntiAfk]
; Stay connected after 60 minutes without input
Enabled=0
; No disconnect 26 hours after logging in
NoSessionTimeout=0

[Ping]
; Show an overlay with the round trip time to the game server in the style of the DXVK HUD; drag it with the left mouse button to move it
; 0 = off, 1 = toggled via /ping, 2 = always visible
OverlayMode=0
; Milliseconds between measurements (500..60000)
Interval=3000
; Where the base line of the text starts, in screen pixels like the DXVK HUD; saved when the text is dragged; the default is the line below the DXVK frame rate
X=8
Y=48
; Text size relative to the DXVK HUD (0.25..4), like its scale option
Scale=1

[Macros]
; How many macros the client allows, up to 127; 0 keeps the client's own limit (12 in 4.x, 24 in 5.x); the game server has to accept them too
Limit=0

[Buffs]
; If set, a window shows up to 64 buffs and 64 debuffs; 0 keeps the client's window, which shows 24 buffs and 24 debuffs in 4.x, 40 buffs and 24 debuffs in 5.x.
; The game server decides how many effects a character has (retail servers: 16 buffs, 20 debuffs).
; Icons per row in the buff window of the target, 1..64 (the client's: 10), with as many rows as the effects take
TargetColumns=0
; Icons per row in the own buff and debuff windows, 1..64 (the client's: 8), the windows sized for all 64
OwnColumns=0

[Stats]
; Show attack, casting and movement speed in the character window with as many decimals as they have (up to 3) instead of 1
Enabled=0

[QuestTargets]
; Show quest icons in front of the names of monsters a quest step needs, as 4.9+ clients already do by themselves
; as well as the green glow over gatherable quest objects that 4.7+ clients show
; Note: Verified to work in 4.6.2 and 4.8, but not in 3.9, as its data has no quest target effect and the quest icons are not found there
Enabled=0

[UiScale]
; Scale the UI as 4.x does, so that 100 % fits the screen at any resolution (2.25 times on 3840x2160) and the slider goes from 70 to 100 % (5.x)
Fit=0
; Fonts from this pixel height get the larger glyph cells, so letters like g and y keep their tails at high UI scales (5.x); 33 keeps the client's own, 24 suits a 3840x2160 screen
LargeGlyphFrom=33

[MultiClient]
; Start more than two clients at once; without it a third client closes the other two
Enabled=0

[Login]
; Go from the login straight to the server list, without the user agreement in between
SkipAgreement=0

[Performance]
; Accelerate loading of the game data for a faster start and exit: 0 = off, 1 = on, 2 = on, plus it skips the logo before the login screen and the picture after quitting
LoadingMode=0
; Use mimalloc in place of the game's memory allocators; it accelerates loading times and can improve overall performance, but uses an
; additional 600 MB to 1 GB of memory
Mimalloc=0
